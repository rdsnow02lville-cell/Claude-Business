name: Pinterest autopost
on:
  schedule:
    - cron: "0 15 */3 * *"   # every 3 days at 15:00 UTC (~10am Central)
  workflow_dispatch: {}       # manual "Run workflow" button for testing
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post next pin
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python3 scripts/post_pin.py
      - name: Save queue position
        run: |
          git config user.name "pin-bot"
          git config user.email "actions@github.com"
          git add scripts/state.json
          git diff --cached --quiet || git commit -m "pin-bot: advance queue"
          git push
